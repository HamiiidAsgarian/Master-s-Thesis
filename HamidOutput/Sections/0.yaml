abstract_en: |
  Smart neighbourhood microgrids represent the localised frontier of energy decentralisation, enabling households equipped with solar panels and battery storage to share surplus energy with neighbours. Standard multi-agent reinforcement learning (MARL) approaches to energy management typically optimise for collective efficiency, but efficiency-only optimisation can produce inequitable outcomes. This study introduces a personality-modulated reward framework to investigate how heterogeneous, psychologically-grounded fairness preferences shape energy-sharing dynamics in a smart neighbourhood. An agent-based simulation of 10 houses in a ring topology was designed, with each house controlled by an independent tabular Q-learning agent operating in a 96-state discrete state space. Five personality types (pure_selfish, individualist, prosocial, altruistic, and high_openness_innovator) were defined based on the Big Five (OCEAN) personality model. Five community compositions with 5 random seeds each (25 independent runs, 8,000 episodes per run) were tested. Results show that prosocial agents in mixed communities achieve 2.9 percentage points higher comfort than selfish neighbours (p = 0.0011), and this advantage remains stable across all scarcity levels. The most surprising finding was the Innovator Effect: a single high-Openness agent with sustained exploration reduced community comfort by 2%, increased inequality by 22% (Gini coefficient), and raised blackout rates by 8.3%. At the community level, no significant differences were observed between homogeneous selfish and prosocial scenarios. This study demonstrates that distributional fairness can be improved without sacrificing efficiency in energy-sharing systems. The Innovator Effect carries a cautionary implication for AI safety in community resource-sharing systems: unpredictable agents, even with good intentions, can undermine cooperative norms.

