abstract_fa: |
  ریزشبکه‌های هوشمند محله‌ای، به‌عنوان مرز محلی‌شده‌ی تمرکززدایی انرژی، امکان اشتراک انرژی مازاد بین خانوارهای مجهز به پنل‌های خورشیدی و ذخیره‌ساز باتری را فراهم می‌آورند. بااین‌حال، رویکردهای استاندارد یادگیری تقویتی چندعاملی (MARL) در مدیریت انرژی، معمولاً بهینه‌سازی کارایی جمعی را هدف قرار می‌دهند که می‌تواند پیامدهای ناعادلانه‌ای ایجاد کند. این پژوهش با معرفی چارچوب پاداش تعدیل‌شده با شخصیت، به بررسی تأثیر ترجیحات عدالت ناهمگن و زمین‌گذاری‌شده‌ی روان‌شناختی بر پویایی‌های اشتراک انرژی در یک محله‌ی هوشمند می‌پردازد. یک شبیه‌سازی مبتنی بر عامل با ۱۰ خانه در توپولوژی حلقوی طراحی شد که هر خانه توسط یک عامل یادگیری Q مستقل با فضای حالت گسسته‌ی ۹۶ وضعیتی کنترل می‌شود. پنج نوع شخصیتی (خودخواه محض، فردگرا، نوع‌گرا، نوع‌دوست و مبتکر با گشودگی بالا) بر اساس مدل پنج‌عاملی شخصیت (OCEAN) تعریف شدند. پنج سناریوی ترکیب جامعه با ۵ تصادف‌سازی (۲۵ اجرای مستقل، هر یک ۸۰۰۰ قسمت) آزمایش شدند. یافته‌ها نشان داد که عامل‌های نوع‌گرا در جوامع مختلط به ۹/۲ واحد درصد آسایش بالاتر نسبت به همسایگان خودخواه دست می‌یابند (۰۰۱۱/۰ = p) و این مزیت در تمام سطوح کمبود منابع پایدار است. شگفت‌انگیزترین یافته، اثر مبتکر بود: یک عامل منفرد با گشودگی بالا (اکتشاف ادامه‌دار) باعث کاهش ۲ درصدی آسایش جامعه، افزایش ۲۲ درصدی نابرابری (ضریب جینی) و افزایش ۳/۸ درصدی نرخ خاموشی شد. در سطح جامعه، تفاوت معنی‌داری بین سناریوهای خودخواه و نوع‌گرای همگن مشاهده نشد. این پژوهش نشان می‌دهد که عدالت توزیعی را می‌توان بدون کاهش کارایی در سیستم‌های اشتراک انرژی بهبود بخشید. اثر مبتکر به‌عنوان یک هشدار مهم برای طراحی سیستم‌های هوش مصنوعی در مدیریت منابع اشتراکی مطرح است: عامل‌های غیرقابل‌پیش‌بینی، حتی با نیت خوب، می‌توانند هنجارهای همکاری را تضعیف کنند.

